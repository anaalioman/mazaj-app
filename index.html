<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>مزاج</title>
  </head>
  <body>
    <div id="home-screen"></div>

    <div id="fireworks-mood" class="mzj-hidden">
      <div id="app"></div>

      <form id="setup-overlay" class="panel">
        <h1>جهّز عرض الألعاب النارية</h1>

        <label class="field">
          <span>الصورة الاحتفالية (اختياري)</span>
          <span class="mzj-file-picker">
            <span class="mzj-file-picker-name" id="image-input-name">لم يتم اختيار صورة</span>
            <span class="mzj-file-picker-btn">استعراض</span>
          </span>
          <input type="file" id="image-input" accept="image/*" class="mzj-file-input-sr" />
        </label>

        <label class="field">
          <span>العبارة التي تريد كتابتها</span>
          <input type="text" id="phrase-input" value="مبروك" maxlength="40" />
        </label>

        <button id="start-show-btn" type="submit"><span id="start-show-label">ابدأ العرض</span></button>
      </form>

      <div class="hint hidden">انقر في أي مكان لإطلاق لعبة نارية</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
